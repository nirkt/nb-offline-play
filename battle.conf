# The battle that ./play.sh starts (applied at every PLAY). Names as in the game's csv tables, see README.md.
# Players 1-10 in order (player 1 = you, the top-left circle is the first name).

location = Survival612            # map: csv_logic locations.csv Name (see README: the list of maps)
theme    = location               # map skin: a location_themes.csv Name, or "location" = the map's own skin

# brawler per player: characters.csv Name or display name (Piper, Colt, ...), 10 of them
brawler  = Piper, Colt, Shelly, Bull, Dynamike, Penny, Poco, Brock, Nita, Jessie

# skin per player: "alt" = the brawler's alternate skin, "default" = its own default skin,
# or a skins.csv Name (e.g. Sniperrose). One per player, same order as brawler.
skin     = alt, alt, alt, alt, alt, alt, alt, alt, alt, alt
